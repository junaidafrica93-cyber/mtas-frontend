<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOBMETRIX</title>

<style>
video.bg{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  object-fit:cover;
  z-index:-2;
  filter: brightness(0.5) contrast(1.2);
}

.overlay{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.7);
  z-index:-1;
}

body{margin:0;font-family:'Segoe UI',sans-serif;color:white;}
.container{display:flex;justify-content:center;align-items:center;height:100vh;}

.card{
  background:rgba(20,30,60,0.4);
  backdrop-filter:blur(15px);
  padding:30px;
  border-radius:20px;
  width:460px;
  text-align:center;
}

button{
  width:100%;padding:12px;margin-top:10px;
  border:none;border-radius:12px;
  background:linear-gradient(135deg,#0ea5e9,#2563eb);
  color:white;font-weight:bold;cursor:pointer;
}

.hidden{display:none;}
</style>
</head>

<body>

<!-- ✅ VIDEO FIX -->
<video class="bg" autoplay muted loop playsinline>
  <source src="background.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- LANDING -->
<div id="landing" class="container">
  <div class="card">
    <h2>🚀 JOBMETRIX</h2>
    <button onclick="show('manual')">Start</button>
  </div>
</div>

<!-- MANUAL ENTRY -->
<div id="manual" class="container hidden">
  <div class="card">
    <h2>Enter Profile</h2>
    <input id="name" placeholder="Full Name">
    <textarea id="experience" placeholder="Experience"></textarea>

    <button onclick="analyzeProfile()">Analyze with AI</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="container hidden"></div>

<script>
function show(id){
  document.querySelectorAll('.container').forEach(el=>el.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// ✅ AI CONNECTION
async function analyzeProfile(){

  const name = document.getElementById("name").value;
  const experience = document.getElementById("experience").value;

  document.getElementById("dashboard").innerHTML = `
    <div class="card">
      <h2>⚡ Processing...</h2>
    </div>
  `;

  show("dashboard");

  try {
    const res = await fetch("https://mtas-backend.onrender.com/analyze", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ name, experience })
    });

    const data = await res.json();

    document.getElementById("dashboard").innerHTML = `
      <div class="card">
        <h2>🚀 JOBMETRIX Results</h2>
        <p><b>Name:</b> ${data.name}</p>
        <p><b>Experience:</b> ${data.experience_level}</p>
        <p><b>Skills:</b> ${data.skills.join(', ')}</p>
        <p><b>Roles:</b> ${data.recommended_roles.join(', ')}</p>

        <button onclick="show('landing')">Back</button>
      </div>
    `;

  } catch(e){

    document.getElementById("dashboard").innerHTML = `
      <div class="card">
        <h2>❌ Error</h2>
        <button onclick="show('landing')">Back</button>
      </div>
    `;
  }
}
</script>

</body>
</html>
