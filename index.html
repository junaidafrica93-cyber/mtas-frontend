<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Talent Acquisition Specialist</title>

<style>
video.bg{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
  filter: brightness(0.6) contrast(1.05);
}

.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(15,23,42,0.7);
  z-index:-1;
}

body{margin:0;font-family:'Segoe UI',sans-serif;color:white;}
.container{display:flex;justify-content:center;align-items:center;height:100vh;}
.card{background:rgba(30,41,59,0.85);backdrop-filter:blur(12px);padding:30px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,0.6);width:460px;text-align:center;}
h2{color:#60a5fa;}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:white;font-weight:bold;cursor:pointer;transition:0.2s;}
button:hover{transform:translateY(-2px);box-shadow:0 8px 15px rgba(59,130,246,0.4);} 
.back{background:#334155;}
input,textarea{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;background:rgba(15,23,42,0.7);color:white;}
.checkbox{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;background:rgba(15,23,42,0.7);border-radius:12px;}
.checkbox input{appearance:none;width:20px;height:20px;border:2px solid #3b82f6;border-radius:6px;cursor:pointer;position:relative;}
.checkbox input:checked{background:#3b82f6;}
.checkbox input:checked::after{content:"✓";color:white;position:absolute;top:-2px;left:5px;}
.footer{margin-top:20px;font-size:13px;}
.footer a{color:#60a5fa;text-decoration:none;}
.hidden{display:none;}
</style>
</head>

<body>

<!-- ✅ FIX FOR EDGE + ALL BROWSERS -->
<video class="bg" autoplay muted loop playsinline>
  <source src="./background.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div id="landing" class="container">
  <div class="card">
    <h2>🚀 My Talent Acquisition Specialist</h2>
    <p style="opacity:0.7;font-size:12px;">AI-Powered Talent Matching Platform</p>
    <button onclick="show('signupChoice')">Sign Up</button>
    <button onclick="show('signin')">Sign In</button>
    <div class="footer">
      <a href="terms.html" target="_blank">Terms</a> |
      <a href="privacy.html" target="_blank">Privacy</a>
    </div>
  </div>
</div>

<div id="signin" class="container hidden">
  <div class="card">
    <h2>Sign In</h2>
    <input placeholder="Email">
    <input type="password" placeholder="Password">
    <button onclick="show('dashboard')">Login</button>
    <button class="back" onclick="show('landing')">⬅ Back</button>
  </div>
</div>

<div id="signupChoice" class="container hidden">
  <div class="card">
    <h2>Choose Sign Up Method</h2>
    <button onclick="show('linkedin')">LinkedIn</button>
    <button onclick="show('cvUpload')">Upload CV</button>
    <button onclick="show('manual')">Manual Entry</button>
    <button class="back" onclick="show('landing')">⬅ Back</button>
  </div>
</div>

<div id="linkedin" class="container hidden">
  <div class="card">
    <h2>LinkedIn</h2>
    <input id="li_name" placeholder="Full Name">
    <input id="li_email" placeholder="Email">
    <div class="checkbox">
      <input type="checkbox" id="li_consent">
      <label>I accept <a href="terms.html" target="_blank">Terms</a> and <a href="privacy.html" target="_blank">Privacy</a></label>
    </div>
    <button onclick="show('dashboard')">Continue</button>
    <button class="back" onclick="show('signupChoice')">Back</button>
  </div>
</div>

<div id="cvUpload" class="container hidden">
  <div class="card">
    <h2>Upload CV</h2>
    <input id="cv_file" type="file">
    <div class="checkbox">
      <input type="checkbox" id="cv_consent">
      <label>I accept <a href="terms.html" target="_blank">Terms</a> and <a href="privacy.html" target="_blank">Privacy</a></label>
    </div>
    <button onclick="show('dashboard')">Continue</button>
    <button class="back" onclick="show('signupChoice')">Back</button>
  </div>
</div>

<div id="manual" class="container hidden">
  <div class="card">
    <h2>Manual Entry</h2>
    <input id="name" placeholder="Full Name">
    <textarea id="experience" placeholder="Experience"></textarea>
    <div class="checkbox">
      <input type="checkbox" id="manual_consent">
      <label>I accept <a href="terms.html" target="_blank">Terms</a> and <a href="privacy.html" target="_blank">Privacy</a></label>
    </div>
    <button onclick="show('dashboard')">Continue</button>
    <button class="back" onclick="show('signupChoice')">Back</button>
  </div>
</div>

<div id="dashboard" class="container hidden">
  <div class="card">
    <h2>✅ Profile Saved</h2>
    <button class="back" onclick="show('landing')">Back Home</button>
  </div>
</div>

<script>
function show(id){
 document.querySelectorAll('.container').forEach(s=>s.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
}
</script>

</body>
</html>
